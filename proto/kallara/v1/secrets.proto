syntax = "proto3";

package kallara.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Named configuration secrets: database credentials, SMTP passwords, API keys.
// Values only ever travel in request and response bodies, never in URLs.
service SecretService {
  // Read a secret's value: the latest version, or the one asked for.
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse) {
    option (google.api.http) = {get: "/v1/{name=projects/*/environments/*/secrets/*}"};
  }

  // Store a new value as the secret's next version, creating the secret if needed.
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/environments/*/secrets/*}/versions"
      body: "*"
    };
  }

  // Secret names and metadata in an environment. Never returns values.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*/environments/*}/secrets"};
  }

  // A secret's versions and metadata. Never returns values.
  rpc ListSecretVersions(ListSecretVersionsRequest) returns (ListSecretVersionsResponse) {
    option (google.api.http) = {get: "/v1/{name=projects/*/environments/*/secrets/*}/versions"};
  }

  // Schedule a secret and all its versions for deletion after a recovery window.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/environments/*/secrets/*}"};
  }

  // Cancel a scheduled deletion during the recovery window.
  rpc RestoreSecret(RestoreSecretRequest) returns (RestoreSecretResponse) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/environments/*/secrets/*}:restore"
      body: "*"
    };
  }
}

message GetSecretRequest {
  // projects/{project}/environments/{environment}/secrets/{secret}
  string name = 1;
  // 0 means the latest version.
  uint32 version = 2;
}

message GetSecretResponse {
  // UTF-8 text, at most 64 KiB.
  string value = 1;
  uint32 version = 2;
  google.protobuf.Timestamp create_time = 3;
}

message PutSecretRequest {
  // projects/{project}/environments/{environment}/secrets/{secret}
  string name = 1;
  // UTF-8 text, at most 64 KiB.
  string value = 2;
}

message PutSecretResponse {
  uint32 version = 1;
  google.protobuf.Timestamp create_time = 2;
}

message ListSecretsRequest {
  // projects/{project}/environments/{environment}
  string parent = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListSecretsResponse {
  repeated SecretMetadata secrets = 1;
  string next_page_token = 2;
}

// Everything about a secret except its value.
message SecretMetadata {
  // projects/{project}/environments/{environment}/secrets/{secret}
  string name = 1;
  uint32 latest_version = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;
  // Set while the secret is scheduled for deletion: when it will be deleted.
  google.protobuf.Timestamp delete_time = 5;
}

message ListSecretVersionsRequest {
  // projects/{project}/environments/{environment}/secrets/{secret}
  string name = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListSecretVersionsResponse {
  repeated SecretVersion versions = 1;
  string next_page_token = 2;
}

message SecretVersion {
  uint32 version = 1;
  google.protobuf.Timestamp create_time = 2;
}

message DeleteSecretRequest {
  // projects/{project}/environments/{environment}/secrets/{secret}
  string name = 1;
  // Days before deletion, 7 to 30. 0 means 7.
  uint32 recovery_days = 2;
}

message DeleteSecretResponse {
  // When the secret will be deleted.
  google.protobuf.Timestamp delete_time = 1;
}

message RestoreSecretRequest {
  // projects/{project}/environments/{environment}/secrets/{secret}
  string name = 1;
}

message RestoreSecretResponse {
  SecretMetadata secret = 1;
}
