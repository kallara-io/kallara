tags:
    - name: CryptoService
      description: |-
        Operations that use a named key without ever returning it. Algorithms come
         from the key version, never from the request. The caller's organization comes
         from its access token.
    - name: SecretService
      description: |-
        Named configuration secrets: database credentials, SMTP passwords, API keys.
         Values only ever travel in request and response bodies, never in URLs.
