name: contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Pinned buf version
        run: echo "BUF=@bufbuild/buf@$(sed -n 's/^BUF_VERSION=//p' tools/generate.sh)" >> "$GITHUB_ENV"
      - name: Lint
        run: npx --yes "$BUF" lint
      - name: No breaking changes against main
        run: |
          # cat-file paths are from the repo root; ls-tree's were relative to proto/ and never matched.
          if git cat-file -e origin/main:proto/buf.yaml 2>/dev/null; then
            npx --yes "$BUF" breaking --against '../.git#ref=origin/main,subdir=proto'
          else
            echo "main has no proto/ yet; nothing to compare"
          fi
      - name: OpenAPI is up to date
        run: tools/generate.sh --check
      - name: Contract tests
        run: uv run -q --no-project --with pytest==9.2.0 --with pyyaml==6.0.3 pytest tests -q
